<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact WPFWDesigns with a question or message."
    />
    <title>Contact | WPFWDesigns</title>
    <link rel="stylesheet" href="style.css" />
    <script src="weather-theme.js" defer></script>
  </head>
  <body data-page="contact" class="page-contact">
    <a href="index.html" class="brand-tag" aria-label="Go to the home page"><i>WPFWDesigns</i></a>

    <nav class="top-nav" aria-label="Main navigation">
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav-menu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <ul class="nav-menu" id="site-nav-menu">
        <li><a href="whoami.html">Whoami</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
        <li class="nav-options">
          <span class="nav-options__label">Options</span>
          <div class="weather-theme" data-weather-theme>
            <p class="weather-theme__status" data-weather-status role="status" aria-live="polite">Amsterdam | Loading weather...</p>
            <div class="weather-theme__controls" role="group" aria-label="Theme mode">
              <button class="weather-theme__button" type="button" data-theme-mode="auto" aria-pressed="true">Auto</button>
              <button class="weather-theme__button" type="button" data-theme-mode="light" aria-pressed="false">Light</button>
              <button class="weather-theme__button" type="button" data-theme-mode="dark" aria-pressed="false">Dark</button>
            </div>
          </div>
        </li>
      </ul>
    </nav>

    <main class="page-content contact-page">
      <h1>Contact Us</h1>
      <p class="contact-intro">Have a question or want to get in touch? Send me a message.</p>

      <form class="contact-form" id="contact-form" novalidate>
        <div class="contact-field">
          <label for="contact-name">Name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Enter your name" minlength="2" maxlength="80" aria-describedby="contact-name-error" required />
          <p class="contact-error" id="contact-name-error" hidden></p>
        </div>

        <div class="contact-field">
          <label for="contact-email">Email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" aria-describedby="contact-email-error" required />
          <p class="contact-error" id="contact-email-error" hidden></p>
        </div>

        <div class="contact-field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" placeholder="Write your feedback here" minlength="10" maxlength="1000" aria-describedby="contact-message-error" required></textarea>
          <p class="contact-error" id="contact-message-error" hidden></p>
        </div>

        <p class="contact-note">This form is currently a demo and does not send or store your information.</p>
        <button class="contact-submit" type="submit">Send message</button>
        <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer class="site-footer">
      <p>© 2026 WPFWDesigns. All rights reserved.</p>
    </footer>

    <a class="scroll-cue" href="index.html" aria-label="Continue to Home"></a>

    <script>
      const toggleButton = document.querySelector('.menu-toggle');
      const navMenu = document.querySelector('.nav-menu');
      const contactForm = document.querySelector('#contact-form');
      const contactStatus = document.querySelector('#contact-status');
      const fields = [
        {
          input: document.querySelector('#contact-name'),
          error: document.querySelector('#contact-name-error'),
          getMessage: (input) => {
            const value = input.value.trim();
            if (!value) return 'Enter your name.';
            if (value.length < 2) return 'Name must be at least 2 characters.';
            if (value.length > 80) return 'Name must be 80 characters or fewer.';
            return '';
          }
        },
        {
          input: document.querySelector('#contact-email'),
          error: document.querySelector('#contact-email-error'),
          getMessage: (input) => {
            if (!input.value.trim()) return 'Enter your email address.';
            if (input.validity.typeMismatch) return 'Enter a valid email address.';
            if (input.value.length > 254) return 'Email must be 254 characters or fewer.';
            return '';
          }
        },
        {
          input: document.querySelector('#contact-message'),
          error: document.querySelector('#contact-message-error'),
          getMessage: (input) => {
            const value = input.value.trim();
            if (!value) return 'Enter a feedback message.';
            if (value.length < 2) return 'Message must be at least 2 characters.';
            if (value.length > 1000) return 'Message must be 1000 characters or fewer.';
            return '';
          }
        }
      ];
      let validationAttempted = false;

      const validateField = ({ input, error, getMessage }) => {
        error.textContent = getMessage(input);
        error.hidden = !error.textContent;
        input.setAttribute('aria-invalid', String(!error.hidden));
        return error.hidden;
      };

      toggleButton.addEventListener('click', () => {
        const isOpen = navMenu.classList.toggle('open');
        toggleButton.setAttribute('aria-expanded', String(isOpen));
      });

      fields.forEach((field) => {
        field.input.addEventListener('input', () => {
          if (!validationAttempted) return;
          validateField(field);
          contactStatus.textContent = '';
          contactStatus.classList.remove('is-error');
        });
      });

      contactForm.addEventListener('submit', (event) => {
        event.preventDefault();
        validationAttempted = true;
        const validity = fields.map(validateField);
        const firstInvalidIndex = validity.indexOf(false);
        const firstInvalid = firstInvalidIndex === -1 ? null : fields[firstInvalidIndex];

        if (firstInvalid) {
          contactStatus.classList.add('is-error');
          contactStatus.textContent = 'Please correct the highlighted fields and try again.';
          firstInvalid.input.focus();
          return;
        }

        contactStatus.classList.remove('is-error');
        contactStatus.textContent = 'Your message was not sent or saved. This form is a demo only.';
      });
    </script>
  </body>
</html>
