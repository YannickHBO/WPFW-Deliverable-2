<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore web design and development projects created by WPFWDesigns, including accessible and creative digital experiences."
    />
    <title>Projects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="projects" class="page-projects">
    <a href="index.html" class="brand-tag" aria-label="Go to the home page"><i>WPFWDesigns</i></a>

    <nav class="top-nav" aria-label="Main navigation">
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav-menu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <ul class="nav-menu" id="site-nav-menu">
        <li><a href="whoami.html">Whoami</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="projects.html">Projects</a></li>
      </ul>
    </nav>

    <main class="page-content card-page">
      <h1>Projects</h1>

      <div class="card-grid" id="project-list" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <p>© 2026 WPFWDesigns. All rights reserved.</p>
    </footer>

    <a class="scroll-cue" href="index.html" aria-label="Continue to Home"></a>

    <script>
      const toggleButton = document.querySelector('.menu-toggle');
      const navMenu = document.querySelector('.nav-menu');
      const loadProjects = async () => {
        const projectList = document.querySelector('#project-list');

        try {
          const response = await fetch('projects.json');
          if (!response.ok) throw new Error('Unable to load projects');

          const projects = await response.json();
          projects.forEach((project) => {
            const article = document.createElement('article');
            article.className = 'content-card';

            const label = document.createElement('p');
            label.className = 'card-date';
            label.textContent = project.label;

            const title = document.createElement('h2');
            title.textContent = project.title;

            const description = document.createElement('p');
            description.textContent = project.description;

            article.append(label, title, description);
            projectList.append(article);
          });
        } catch {
          projectList.textContent = 'Projects could not be loaded.';
        }
      };

      loadProjects();

      toggleButton.addEventListener('click', () => {
        const isOpen = navMenu.classList.toggle('open');
        toggleButton.setAttribute('aria-expanded', String(isOpen));
      });

    </script>
  </body>
</html>
