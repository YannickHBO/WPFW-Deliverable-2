<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore web design and development projects created by WPFWDesigns, including accessible and creative digital experiences."
    />
    <title>Projects</title>
    <link rel="stylesheet" href="style.css" />
    <script src="weather-theme.js" defer></script>
  </head>
  <body data-page="projects" class="page-projects">
    <a href="index.html" class="brand-tag" aria-label="Go to the home page"><i>WPFWDesigns</i></a>

    <nav class="top-nav" aria-label="Main navigation">
      <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav-menu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <ul class="nav-menu" id="site-nav-menu">
        <li><a href="whoami.html">Whoami</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li class="nav-options">
          <span class="nav-options__label">Options</span>
          <div class="weather-theme" data-weather-theme>
            <p class="weather-theme__status" data-weather-status role="status" aria-live="polite">Amsterdam | Loading weather...</p>
            <div class="weather-theme__controls" role="group" aria-label="Theme mode">
              <button class="weather-theme__button" type="button" data-theme-mode="auto" aria-pressed="true">Auto</button>
              <button class="weather-theme__button weather-theme__icon-button" type="button" data-theme-mode="light" aria-label="Light theme" title="Light theme" aria-pressed="false"><span aria-hidden="true">☀️</span></button>
              <button class="weather-theme__button weather-theme__icon-button" type="button" data-theme-mode="dark" aria-label="Dark theme" title="Dark theme" aria-pressed="false"><span aria-hidden="true">🌙</span></button>
            </div>
          </div>
        </li>
      </ul>
    </nav>

    <main class="page-content card-page">
      <h1>Projects</h1>

      <div class="project-search">
        <label for="project-search-input">Search projects</label>
        <input
          id="project-search-input"
          type="search"
          placeholder="Search by title or keyword"
          aria-controls="project-list"
          aria-describedby="project-search-status"
        />
      </div>
      <p class="search-status" id="project-search-status" role="status" aria-live="polite"></p>
      <div class="card-grid" id="project-list" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <p>© 2026 WPFWDesigns. All rights reserved.</p>
    </footer>

    <a class="scroll-cue" href="contact.html" aria-label="Continue to Contact"></a>

    <script>
      const toggleButton = document.querySelector('.menu-toggle');
      const navMenu = document.querySelector('.nav-menu');
      const searchInput = document.querySelector('#project-search-input');
      const searchStatus = document.querySelector('#project-search-status');
      let projectCards = [];

      const filterProjects = () => {
        const query = searchInput.value.trim().toLocaleLowerCase();
        const matchingCards = projectCards.filter(({ card, searchText }) => {
          const matches = searchText.includes(query);
          card.hidden = !matches;
          return matches;
        });

        const hasNoMatches = matchingCards.length === 0;
        searchStatus.classList.toggle('is-error', hasNoMatches);
        searchStatus.textContent = hasNoMatches
          ? 'No projects found.'
          : `Showing ${matchingCards.length} of ${projectCards.length} projects.`;
      };

      searchInput.addEventListener('input', filterProjects);

      const loadProjects = async () => {
        const projectList = document.querySelector('#project-list');

        try {
          const response = await fetch('projects.json');
          if (!response.ok) throw new Error('Unable to load projects');

          const projects = await response.json();
          projectCards = projects.map((project) => {
            const article = document.createElement('article');
            article.className = 'content-card';

            const label = document.createElement('p');
            label.className = 'card-date';
            label.textContent = project.label;

            const title = document.createElement('h2');
            title.textContent = project.title;

            const description = document.createElement('p');
            description.textContent = project.description;

            article.append(label, title, description);
            projectList.append(article);
            return {
              card: article,
              searchText: `${project.label} ${project.title} ${project.description}`.toLocaleLowerCase()
            };
          });
          filterProjects();
        } catch {
          searchInput.disabled = true;
          searchInput.classList.add('is-load-error');
          searchInput.placeholder = 'Projects unavailable: projects.json failed';
          searchStatus.classList.remove('is-error');
          searchStatus.classList.add('is-visually-hidden');
          searchStatus.textContent = 'Projects are unavailable because projects.json could not be loaded. If you opened this page directly, serve the site locally and reload.';
        }
      };

      loadProjects();

      toggleButton.addEventListener('click', () => {
        const isOpen = navMenu.classList.toggle('open');
        toggleButton.setAttribute('aria-expanded', String(isOpen));
      });

      document.addEventListener('click', (event) => {
        if (!navMenu.contains(event.target) && !toggleButton.contains(event.target)) {
          navMenu.classList.remove('open');
          toggleButton.setAttribute('aria-expanded', 'false');
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && navMenu.classList.contains('open')) {
          navMenu.classList.remove('open');
          toggleButton.setAttribute('aria-expanded', 'false');
          toggleButton.focus();
        }
      });

    </script>
  </body>
</html>
